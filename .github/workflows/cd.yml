name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先ターゲット (databricks.yml の targets キー)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy bundle
    runs-on: ubuntu-latest
    # main ブランチへの通常pushは dev、workflow_dispatch で prod を選んだ場合のみ prod environment を使う。
    # prod environment に Required reviewers を設定しておくと、ここで承認待ちになる。
    environment: ${{ github.event.inputs.target == 'prod' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          # BUNDLE_VAR_<変数名> は databricks.yml の variables.warehouse_id を上書きする
          # Databricks Asset Bundles 公式の変数上書き機構。warehouse_id は機密情報ではないため
          # secrets ではなく repository variable (vars) から渡す。
          BUNDLE_VAR_warehouse_id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: databricks bundle deploy -t ${{ github.event.inputs.target || 'dev' }}

      - name: Apply ABAC policies
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          BUNDLE_VAR_warehouse_id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
        run: databricks bundle run rag_abac_policies_job -t ${{ github.event.inputs.target || 'dev' }}
