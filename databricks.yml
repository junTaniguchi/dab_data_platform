# dab_data_platform — RAG向けメダリオン基盤（Bronze/Silver/Gold + Vector Search + ABAC）
#
# Databricks Free Edition (workspace: dbc-a2d384f2-d156) 向けに作成した Databricks Asset Bundle。
# STEP 01: Lakeflow Declarative Pipelines による Bronze/Silver/Gold ETL + ABAC ポリシー適用
# STEP 02: Vector Search endpoint / index のバンドル宣言
# STEP 05: Genie Space から参照する集計ビュー
bundle:
  name: dab_data_platform

# 当初 "engine: direct" (Lakeflow Declarative Pipelines の Direct publishing mode を
# 有効化する想定のフィールド) を置いていたが、手元の Databricks CLI v1.9.0 では
# `Warning: unknown field: engine` として認識されず、バンドルのトップレベルフィールドとしては
# 存在しないことを確認したため削除した。Gold テーブルは resources/rag_pipeline_etl.pipeline.yml
# の catalog/schema 設定どおりのスキーマに作成され、Vector Search index はそのテーブルを
# 完全修飾名（var.catalog.var.schema.gold_document_chunks_for_search）で参照するだけなので、
# 本バンドルの構成では特別な engine 設定は不要。

variables:
  # 新規カタログをバンドルで作成しようとしたところ、Free Edition では
  # `POST /unity-catalog/catalogs` に明示的な storage location が必要で
  # （"Metastore storage root URL does not exist... provide a storage location"）、
  # デフォルトストレージが自動適用されるのはUIからの作成に限られることが分かった。
  # そのため新規カタログは作らず、Free Edition に既定で存在する管理カタログ
  # `workspace` の配下にスキーマ/Volumeだけを作成する構成にしている
  # （resources/rag_unity_catalog.yml 参照）。別のワークスペースを使う場合は
  # 既存の適切なカタログ名にこの default を変更すること。
  catalog:
    description: サンプルデータ・メダリオンテーブルを配置する既存の Unity Catalog カタログ名
    default: workspace
  schema:
    description: Bronze/Silver/Gold テーブルを配置するスキーマ名
    default: rag
  warehouse_id:
    description: ABAC ポリシー適用 SQL タスク・Genie Space が使用する SQL ウェアハウス ID（各自の環境のIDに置き換える）
    default: ""
  vector_search_endpoint:
    description: Vector Search endpoint 名
    default: rag_vector_search_endpoint

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a2d384f2-d156.cloud.databricks.com
      # ここに `profile:` を固定で書かない。CI/CD (cd.yml) はサービスプリンシパルの
      # 環境変数 (DATABRICKS_HOST/CLIENT_ID/CLIENT_SECRET) で認証しており、
      # workspace.profile を固定するとその env var ベースの認証より profile 指定が
      # 優先され CI が壊れる可能性があるため。ローカルで同一 host に複数プロファイルが
      # 存在し `multiple profiles matched` になる場合は、コマンド実行時に
      # `--profile <name>` を渡すか `DATABRICKS_CONFIG_PROFILE=<name>` を
      # 環境変数として設定して解決すること（README のセットアップ手順を参照）。
    variables:
      schema: rag_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-a2d384f2-d156.cloud.databricks.com
      # profile を固定しない理由は dev target 側のコメント参照
    variables:
      schema: rag
    run_as:
      user_name: ${workspace.current_user.userName}
