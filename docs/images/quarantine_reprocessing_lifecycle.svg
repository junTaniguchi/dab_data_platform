<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1190" font-family="'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- background (white, so it stays legible in dark-mode viewers) -->
  <rect x="0" y="0" width="1200" height="1190" fill="#ffffff"/>

  <!-- title -->
  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">検疫（Quarantine）の是正・再投入ライフサイクル</text>
  <text x="600" y="48" text-anchor="middle" font-size="12" fill="#6b7280">silver_orders_quarantine → reprocess_quarantine.py → Bronzeへの再投入 → Silverでの再評価</text>

  <!-- legend -->
  <g font-size="12" fill="#111827">
    <rect x="900" y="70" width="270" height="182" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="915" y="90" font-size="12" font-weight="700" fill="#334155">凡例</text>
    <rect x="915" y="100" width="14" height="14" fill="#eef2ff" stroke="#4338ca"/>
    <text x="936" y="111">検疫テーブル（不変のスナップショット）</text>
    <rect x="915" y="124" width="14" height="14" fill="#ecfeff" stroke="#0e7490"/>
    <text x="936" y="135">観測・判定（Validation / Correction判定）</text>
    <rect x="915" y="148" width="14" height="14" fill="#faf5ff" stroke="#7e22ce"/>
    <text x="936" y="159">監査ログ（追記のみ・不変）</text>
    <rect x="915" y="172" width="14" height="14" fill="#f0fdf4" stroke="#15803d"/>
    <text x="936" y="183">是正できた行（CORRECTED）の再投入経路</text>
    <rect x="915" y="196" width="14" height="14" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="936" y="207">是正不能（UNCORRECTABLE）＝人手対応</text>
    <text x="915" y="230" font-size="11" fill="#6b7280">※ silver_orders_quarantine 自体は</text>
    <text x="915" y="244" font-size="11" fill="#6b7280">　一切 UPDATE/DELETE しない</text>
  </g>

  <!-- Box Q: quarantine table -->
  <rect x="420" y="60" width="360" height="90" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">silver_orders_quarantine</text>
  <text x="600" y="108" text-anchor="middle" font-size="12" fill="#3730a3">検疫テーブル（不変のスナップショット）</text>
  <text x="600" y="126" text-anchor="middle" font-size="12" fill="#3730a3">violated_rules 列に違反ルール名を記録</text>

  <line x1="600" y1="150" x2="600" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box V: validation -->
  <rect x="390" y="188" width="420" height="90" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="600" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">① Validation</text>
  <text x="600" y="236" text-anchor="middle" font-size="12" fill="#155e75">gold_data_quality_summary</text>
  <text x="600" y="254" text-anchor="middle" font-size="12" fill="#155e75">ルール別の違反件数・全体 Pass Rate を確認</text>

  <line x1="600" y1="278" x2="600" y2="316" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box C: correction decision -->
  <rect x="350" y="316" width="500" height="90" rx="10" stroke-dasharray="6,4" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <text x="600" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#164e63">② Correction 判定</text>
  <text x="600" y="364" text-anchor="middle" font-size="12" fill="#155e75">reprocess_quarantine.py: decide_resolution()</text>
  <text x="600" y="382" text-anchor="middle" font-size="12" fill="#155e75">違反ルールごとに CORRECTED / UNCORRECTABLE を判定</text>

  <line x1="600" y1="406" x2="600" y2="444" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box Log: audit log (common to both branches) -->
  <rect x="330" y="444" width="540" height="100" rx="10" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="600" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#581c87">quarantine_resolution_log へ追記</text>
  <text x="600" y="490" text-anchor="middle" font-size="12" fill="#6b21a8">是正結果（CORRECTED / UNCORRECTABLE）・理由・時刻を記録</text>
  <text x="600" y="508" text-anchor="middle" font-size="12" fill="#6b21a8">reprocess_quarantine.py が単独で所有する、Lakeflow管理外の素のDeltaテーブル</text>
  <text x="600" y="526" text-anchor="middle" font-size="11" fill="#6b21a8" font-style="italic">（silver_orders_quarantine 自体は不変のまま保持）</text>

  <!-- split arrows -->
  <line x1="480" y1="544" x2="250" y2="584" stroke="#15803d" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="300" y="568" font-size="12" font-weight="700" fill="#15803d">CORRECTED</text>

  <line x1="720" y1="544" x2="950" y2="584" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="820" y="568" font-size="12" font-weight="700" fill="#b91c1c">UNCORRECTABLE</text>

  <!-- Left column: CORRECTED path -->
  <rect x="80" y="584" width="340" height="90" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="250" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">③ apply_correction()</text>
  <text x="250" y="632" text-anchor="middle" font-size="12" fill="#166534">amount → abs() に補正</text>
  <text x="250" y="650" text-anchor="middle" font-size="12" fill="#166534">order_date → 実行日(today)にクリップ</text>

  <line x1="250" y1="674" x2="250" y2="712" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="712" width="340" height="100" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="250" y="740" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">④ 生JSONとして再投入</text>
  <text x="250" y="760" text-anchor="middle" font-size="12" fill="#166534">raw_structured_data/orders/reprocessed/*.json</text>
  <text x="250" y="778" text-anchor="middle" font-size="12" fill="#166534">reprocessed_from_quarantine = true を付与</text>
  <text x="250" y="796" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">（Silver/Bronzeへ直接MERGEしない）</text>

  <line x1="250" y1="812" x2="250" y2="850" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="850" width="340" height="80" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="250" y="878" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Auto Loader が再取り込み</text>
  <text x="250" y="898" text-anchor="middle" font-size="12" fill="#166534">bronze_orders（正面からもう一度取り込み直す）</text>

  <line x1="250" y1="930" x2="250" y2="968" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="968" width="340" height="110" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="250" y="996" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">⑤ Expectation 再評価</text>
  <text x="250" y="1016" text-anchor="middle" font-size="12" fill="#166534">次回の structured_pipeline_job 実行時に</text>
  <text x="250" y="1034" text-anchor="middle" font-size="12" fill="#166534">silver_orders / silver_orders_quarantine へ</text>
  <text x="250" y="1052" text-anchor="middle" font-size="12" fill="#166534">再度振り分けられる（合格すれば今度こそ通過）</text>

  <!-- Right column: UNCORRECTABLE path -->
  <rect x="780" y="584" width="340" height="150" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="950" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">人手対応</text>
  <text x="950" y="632" text-anchor="middle" font-size="12" fill="#991b1b">ソースシステム側で原因調査・修正</text>
  <text x="950" y="650" text-anchor="middle" font-size="12" fill="#991b1b">（例: customer_id 欠落、通貨コード不正）</text>
  <text x="950" y="672" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">※ quarantine_resolution_log に記録済みの</text>
  <text x="950" y="688" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">　order_id は以後自動で再処理されない</text>
  <text x="950" y="704" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">　（真因対応後は人手で新規データとして再投入）</text>

  <!-- footer note -->
  <rect x="60" y="1120" width="1080" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="600" y="1140" text-anchor="middle" font-size="12" fill="#334155">冪等性: 同じ order_id が既に quarantine_resolution_log に記録済みなら、reprocess_quarantine.py はスキップする</text>
  <text x="600" y="1158" text-anchor="middle" font-size="12" fill="#334155">（同じ検疫行から再投入ファイルが重複生成されない）</text>
</svg>
