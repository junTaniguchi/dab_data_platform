# structured_pipeline_etl の定期実行用ジョブ。
# 1. サンプルデータ(customers/orders)を UC Volume へ配置（初回/再セットアップ用途）
# 2. Lakeflow パイプライン（Bronze -> Silver -> Gold）を実行
resources:
  jobs:
    structured_pipeline_job:
      name: structured_pipeline_job

      schedule:
        quartz_cron_expression: "0 30 3 * * ?" # 毎日 03:30 に実行（rag_pipeline_jobの3:00とずらす）
        timezone_id: "Asia/Tokyo"
        pause_status: PAUSED # 初回デプロイ後、動作確認できたら UNPAUSED に変更する

      tasks:
        - task_key: seed_structured_sample_data
          spark_python_task:
            python_file: ../src/structured_pipeline_etl/seed/seed_structured_sample_data.py
            parameters:
              - "--sample_data_dir"
              - ${workspace.file_path}/sample_data/structured
              - "--volume_path"
              - /Volumes/${var.catalog}/${resources.schemas.structured_schema.name}/raw_structured_data
          environment_key: default

        - task_key: run_structured_pipeline_etl
          depends_on:
            - task_key: seed_structured_sample_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.structured_pipeline_etl.id}
            full_refresh: false

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.40.0
