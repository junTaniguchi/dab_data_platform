# governance/abac_policies.sql を SQL ウェアハウス上で適用するジョブ
# governed tags 付与 + ABAC 行フィルタポリシー (CREATE POLICY) を適用する。
# ETL ジョブとは独立して、ガバナンス定義を変更した際に手動/CI から再実行する想定。
resources:
  jobs:
    rag_abac_policies_job:
      name: rag_abac_policies_job

      tasks:
        - task_key: apply_abac_policies
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../governance/abac_policies.sql
            parameters:
              catalog: ${var.catalog}
              # dev target は mode: development のため、実際に作成されるスキーマ名は
              # resources.schemas.rag_schema.name（dev_<user>_rag_dev のように自動で
              # プレフィックスが付く）になる。var.schema のプレーンな値を渡すと
              # `[SCHEMA_NOT_FOUND] The schema workspace.rag_dev cannot be found` になる。
              schema: ${resources.schemas.rag_schema.name}
