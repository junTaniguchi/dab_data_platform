# STEP 02: Vector Search endpoint / index のバンドル宣言
# gold_document_chunks_for_search を source_table として delta_sync 方式で同期する。
# endpoint_name で vector_search_endpoints.rag_vector_search_endpoint を参照しているため、
# 明示的な depends_on がなくてもバンドル側で依存関係が解決される
#（手元の Databricks CLI v1.9.0 では vector_search_indexes.depends_on は
#  `Warning: unknown field: depends_on` として認識されないため削除した）。
resources:
  vector_search_endpoints:
    rag_vector_search_endpoint:
      name: ${var.vector_search_endpoint}
      endpoint_type: STANDARD

  vector_search_indexes:
    rag_document_chunks_index:
      name: ${var.catalog}.${var.schema}.rag_document_chunks_index
      endpoint_name: ${var.vector_search_endpoint}
      primary_key: chunk_id
      index_type: DELTA_SYNC
      delta_sync_index_spec:
        source_table: ${var.catalog}.${var.schema}.gold_document_chunks_for_search
        pipeline_type: TRIGGERED
        embedding_source_columns:
          - name: chunk_text
            embedding_model_endpoint_name: databricks-gte-large-en
