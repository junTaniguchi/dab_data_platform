# rag_pipeline_etl の定期実行用ジョブ
# 1. サンプルデータを UC Volume へ配置（初回/再セットアップ用途、既存ファイルはスキップ）
# 2. Lakeflow パイプライン（Bronze -> Silver -> Gold）を実行
resources:
  jobs:
    rag_pipeline_job:
      name: rag_pipeline_job

      schedule:
        quartz_cron_expression: "0 0 3 * * ?" # 毎日 03:00 に実行
        timezone_id: "Asia/Tokyo"
        pause_status: PAUSED # 初回デプロイ後、動作確認できたら UNPAUSED に変更する

      tasks:
        - task_key: seed_sample_data
          spark_python_task:
            python_file: ../src/rag_pipeline_etl/seed/seed_sample_data.py
            parameters:
              # ${workspace.file_path} はバンドルのファイル同期ルート
              # （例: /Workspace/Users/<user>/.bundle/<name>/<target>/files）。
              # このスクリプトは __file__ から自己位置を逆算できない実行環境のため、
              # サンプルデータのディレクトリを明示的に渡す。
              - "--sample_data_dir"
              - ${workspace.file_path}/sample_data/documents
              - "--volume_path"
              # rag_pipeline_etl.pipeline.yml と同じ理由で、スキーマ名は
              # var.schema ではなく resources.schemas.rag_schema.name
              # （dev target では自動プレフィックス付き）を参照する。
              - /Volumes/${var.catalog}/${resources.schemas.rag_schema.name}/raw_documents
          environment_key: default

        - task_key: run_rag_pipeline_etl
          depends_on:
            - task_key: seed_sample_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.rag_pipeline_etl.id}
            full_refresh: false

      environments:
        - environment_key: default
          spec:
            # `client` は非推奨（"Use `environment_version` instead" と `databricks bundle
            # schema` に明記されている）。当初 `client: "1"` にしていたところ
            # `Invalid platform channel Client-1. Workspace doesn't support Client-1
            # channel for REPL` でクラスタ起動自体に失敗したため environment_version に変更。
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.40.0
